name: CI
on:
  push:
    branches:
      - '**'
      - '!integrated/**'
      - '!stl-preview-head/**'
      - '!stl-preview-base/**'
      - '!generated'
      - '!codegen/**'
      - 'codegen/stl/**'
  pull_request:
    branches-ignore:
      - 'stl-preview-head/**'
      - 'stl-preview-base/**'

jobs:
  classify-production-ci:
    name: classify production CI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      pull-requests: read
      statuses: read
    outputs:
      run_full: ${{ steps.classify.outputs.run_full }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/classify_production_ci.py --event-path "$GITHUB_EVENT_PATH"

  lint:
    needs: classify-production-ci
    timeout-minutes: 30
    name: lint
    runs-on: ${{ github.repository == 'stainless-sdks/telnyx-java' && 'depot-ubuntu-24.04-4' || 'ubuntu-latest' }}
    if: needs.classify-production-ci.outputs.run_full == 'true'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate release CI policy
        run: |-
          python3 .github/scripts/test_release_pr_auto_merge.py -v
          python3 .github/scripts/test_release_pr_ci_gate.py -v
          python3 .github/scripts/test_classify_production_ci.py -v
          python3 .github/scripts/test_validate_next_provenance.py -v
          python3 .github/scripts/test_maven_publication_guard.py -v

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: |
            8
            21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Run lints
        run: ./scripts/lint

  build:
    needs: classify-production-ci
    timeout-minutes: 30
    name: build
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ github.repository == 'stainless-sdks/telnyx-java' && 'depot-ubuntu-24.04-4' || 'ubuntu-latest' }}
    if: needs.classify-production-ci.outputs.run_full == 'true'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: |
            8
            21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Build SDK
        run: |-
          ./scripts/build \
            -Dorg.gradle.jvmargs="-Xmx12g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Get GitHub OIDC Token
        if: |-
          github.repository == 'stainless-sdks/telnyx-java' &&
          !startsWith(github.ref, 'refs/heads/stl/')
        id: github-oidc
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: core.setOutput('github_token', await core.getIDToken());

      - name: Build and upload Maven artifacts
        if: |-
          github.repository == 'stainless-sdks/telnyx-java' &&
          !startsWith(github.ref, 'refs/heads/stl/')
        env:
          URL: https://pkg.stainless.com/s
          AUTH: ${{ steps.github-oidc.outputs.github_token }}
          SHA: ${{ github.sha }}
          PROJECT: telnyx-java
        run: ./scripts/upload-artifacts
  test-shard:
    needs: classify-production-ci
    timeout-minutes: 60
    name: test-shard (${{ matrix.name }})
    runs-on: ${{ github.repository == 'stainless-sdks/telnyx-java' && 'depot-ubuntu-24.04-4' || 'ubuntu-latest' }}
    if: needs.classify-production-ci.outputs.run_full == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sdk
            tasks: test -x :telnyx-proguard-test:test
          - name: proguard
            tasks: :telnyx-proguard-test:testProGuard
          - name: r8
            tasks: :telnyx-proguard-test:testR8
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: |
            8
            21
          cache: gradle

      - name: Set up Gradle
        uses: gradle/gradle-build-action@a8f75513eafdebd8141bd1cd4e30fcd194af8dfa # v2.12.0

      - name: Run ${{ matrix.name }} tests
        run: |
          kotlin_args=()
          if ! grep -q -- '-Xmx8g' gradle.properties; then
            kotlin_args+=("-Pkotlin.compiler.execution.strategy=in-process")
          fi
          ./gradlew ${{ matrix.tasks }} "${kotlin_args[@]}"

  test:
    timeout-minutes: 5
    name: test
    runs-on: ubuntu-latest
    needs: [classify-production-ci, test-shard]
    if: always() && needs.classify-production-ci.outputs.run_full == 'true'
    steps:
      - name: Verify all test shards passed
        env:
          SHARD_RESULT: ${{ needs.test-shard.result }}
        run: |
          if [ "$SHARD_RESULT" != "success" ]; then
            echo "One or more Java test shards failed: $SHARD_RESULT"
            exit 1
          fi
