name: Publish Sonatype

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable vMAJOR.MINOR.PATCH tag to publish or verify
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-sonatype-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Require an immutable version tag
        id: release
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/master" ]]; then
              echo "Manual recovery must execute trusted workflow code from refs/heads/master; got ${GITHUB_REF}" >&2
              exit 1
            fi
            TAG="${DISPATCH_TAG}"
          else
            if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
              echo "Release publication must run from an immutable tag; got ${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" >&2
              exit 1
            fi
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Publish Sonatype requires an exact vMAJOR.MINOR.PATCH tag; got ${TAG}" >&2
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

      - name: Checkout trusted publication policy
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: master
          fetch-depth: 0
          path: trusted-policy
          persist-credentials: false

      - name: Resolve and attest the immutable release tag
        id: source
        working-directory: trusted-policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --silent
          git fetch --force origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          TAG_SHA=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          if ! git merge-base --is-ancestor "${TAG_SHA}" origin/master; then
            echo "Release tag ${RELEASE_TAG} (${TAG_SHA}) is not reachable from trusted master." >&2
            exit 1
          fi
          echo "sha=${TAG_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Checkout immutable release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: release-source
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: |
            8
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Test publication guards
        run: python3 trusted-policy/.github/scripts/test_maven_publication_guard.py

      - name: Inspect immutable Maven Central coordinates
        id: preflight
        run: >-
          python3 trusted-policy/.github/scripts/maven_publication_guard.py preflight
          "${{ steps.release.outputs.version }}"
          --github-output "${GITHUB_OUTPUT}"

      - name: Publish to Maven Central
        id: gradle_publish
        if: steps.preflight.outputs.needs_publish == 'true'
        continue-on-error: true
        working-directory: release-source
        env:
          GPG_SIGNING_KEY: ${{ secrets.TELNYX_SONATYPE_GPG_SIGNING_KEY || secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.TELNYX_SONATYPE_GPG_SIGNING_PASSWORD || secrets.GPG_SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.TELNYX_SONATYPE_USERNAME || secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.TELNYX_SONATYPE_PASSWORD || secrets.SONATYPE_PASSWORD }}
        run: |
          set -euo pipefail
          export GPG_SIGNING_KEY_ID
          printenv -- GPG_SIGNING_KEY | gpg --batch --passphrase-fd 3 --import 3<<< "${GPG_SIGNING_PASSWORD}"
          GPG_SIGNING_KEY_ID="$(gpg --with-colons --list-keys | awk -F : -- '/^pub:/ { getline; print "0x" substr($10, length($10) - 7) }')"
          ./gradlew publishAndReleaseToMavenCentral \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx12g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Verify complete Maven Central publication
        id: postflight
        if: steps.preflight.outputs.needs_publish == 'true'
        continue-on-error: true
        run: >-
          python3 trusted-policy/.github/scripts/maven_publication_guard.py postflight
          "${{ steps.release.outputs.version }}"
          --attempts 20
          --interval-seconds 30

      - name: Require a complete publication
        if: always() && steps.preflight.outcome == 'success'
        shell: bash
        env:
          NEEDS_PUBLISH: ${{ steps.preflight.outputs.needs_publish }}
          GRADLE_OUTCOME: ${{ steps.gradle_publish.outcome }}
          POSTFLIGHT_OUTCOME: ${{ steps.postflight.outcome }}
        run: |
          set -euo pipefail
          if [[ "${NEEDS_PUBLISH}" == "false" ]]; then
            echo "All immutable coordinates already exist; retry is an idempotent no-op."
            exit 0
          fi
          if [[ "${POSTFLIGHT_OUTCOME}" == "success" ]]; then
            if [[ "${GRADLE_OUTCOME}" != "success" ]]; then
              echo "Gradle reported ${GRADLE_OUTCOME}, but authoritative Maven Central verification is complete."
            fi
            exit 0
          fi
          echo "Publication is incomplete: Gradle=${GRADLE_OUTCOME}, Maven Central postflight=${POSTFLIGHT_OUTCOME}." >&2
          exit 1
